<!DOCTYPE html>
<html lang="en">
    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Tarjeta de blog minimalista diseñada para practicar el uso de Flexbox, Box Shadows y la estructura de componentes web responsivos">
        <title>devChallenges.io | Minimal Blog Card</title>
        <link rel="icon" href="resources/favicon.ico" type="image/x-icon" sizes="96x96"/>

        <footer>

                <p>Coded by
